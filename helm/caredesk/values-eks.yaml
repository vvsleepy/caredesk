# AWS EKS deployment: pulls scanned images from GHCR, ingress via the
# ingress-nginx controller (AWS NLB), EBS gp3 volume for PostgreSQL data.
backend:
  image: ghcr.io/vvsleepy/caredesk-backend
  tag: latest
  replicas: 2

frontend:
  image: ghcr.io/vvsleepy/caredesk-frontend
  tag: latest
  replicas: 2

ingress:
  enabled: true
  host: caredesk.local

hpa:
  enabled: true
  minReplicas: 2
  maxReplicas: 4

postgres:
  # EBS CSI driver provisions this dynamically on EKS.
  storageClassName: gp3
