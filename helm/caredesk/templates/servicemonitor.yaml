# Tells kube-prometheus-stack to scrape the backend /metrics endpoint.
# The `release` label must equal the monitoring release name.
{{- if .Values.monitoring.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "caredesk.fullname" . }}-backend
  labels:
    {{- include "caredesk.labels" . | nindent 4 }}
    release: {{ .Values.monitoring.serviceMonitor.releaseLabel }}
spec:
  selector:
    matchLabels:
      app: caredesk-backend
  endpoints:
    - port: http
      path: /metrics
      interval: {{ .Values.monitoring.serviceMonitor.interval }}
{{- end }}
