# CareDesk PostgreSQL reads credentials from a pre-created Secret; data is
# stored in a PVC-backed StatefulSet so records survive pod restarts.
apiVersion: v1
apiVersion: v1
kind: Service
metadata:
  name: {{ include "caredesk.fullname" . }}-postgres
  labels:
    {{- include "caredesk.labels" . | nindent 4 }}
    app: caredesk-postgres
spec:
  type: ClusterIP
  clusterIP: None
  selector:
    app: caredesk-postgres
    release: {{ .Release.Name }}
  ports:
    - port: 5432
      targetPort: postgres
      protocol: TCP
      name: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "caredesk.fullname" . }}-postgres
  labels:
    {{- include "caredesk.labels" . | nindent 4 }}
    app: caredesk-postgres
spec:
  serviceName: {{ include "caredesk.fullname" . }}-postgres
  replicas: 1
  selector:
    matchLabels:
      app: caredesk-postgres
      release: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: caredesk-postgres
        release: {{ .Release.Name }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        fsGroup: 999
      containers:
        - name: postgres
          image: "{{ .Values.postgres.image }}"
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5432
              name: postgres
          env:
            - name: POSTGRES_DB
              value: {{ .Values.postgres.database | quote }}
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgres.existingSecret }}
                  key: username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgres.existingSecret }}
                  key: password
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: caredesk-data
              mountPath: /var/lib/postgresql/data
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 999
            capabilities:
              drop:
                - ALL
  volumeClaimTemplates:
    - metadata:
        name: caredesk-data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- if .Values.postgres.storageClassName }}
        storageClassName: {{ .Values.postgres.storageClassName | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.postgres.storageSize | quote }}
