# kind cluster for the CareDesk local rehearsal. Host ports 80/443 are mapped
# so the ingress-nginx NodePorts reach http://caredesk.local on the laptop.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 80
        hostPort: 80
        protocol: TCP
      - containerPort: 443
        hostPort: 443
        protocol: TCP
  - role: worker
  - role: worker
