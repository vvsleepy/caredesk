apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: caredesk-ingress
  namespace: caredesk
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80}]'
    alb.ingress.kubernetes.io/healthcheck-path: /
    alb.ingress.kubernetes.io/subnets: subnet-050fd08a0ada53abf,subnet-0cb453bf6d2ae3bb8
spec:
  ingressClassName: alb
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: caredesk-caredesk-frontend
                port:
                  number: 8080
