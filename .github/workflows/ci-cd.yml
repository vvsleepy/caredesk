name: CareDesk CI/CD

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: caredesk-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2

      - name: Set up Python 3.12
        uses: actions/setup-python@v5.3.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Run backend tests
        working-directory: backend
        run: pytest -v

      - name: Set up Node 22
        uses: actions/setup-node@v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: npm ci && npm run build

  build-scan-push:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      TRIVY_DB_REPOSITORY: public.ecr.aws/aquasecurity/trivy-db:2
      TRIVY_JAVA_DB_REPOSITORY: public.ecr.aws/aquasecurity/trivy-java-db:1
    steps:
      - uses: actions/checkout@v4.2.2

      - name: Resolve lowercase image names
        run: |
          owner_lower="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          echo "BACKEND_IMAGE=ghcr.io/${owner_lower}/caredesk-backend" >> "$GITHUB_ENV"
          echo "FRONTEND_IMAGE=ghcr.io/${owner_lower}/caredesk-frontend" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3.9.0

      - name: Log in to GHCR
        uses: docker/login-action@v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build backend image
        uses: docker/build-push-action@v6.9.0
        with:
          context: ./backend
          platforms: linux/amd64
          load: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
            ${{ env.BACKEND_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v6.9.0
        with:
          context: ./frontend
          platforms: linux/amd64
          load: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
            ${{ env.FRONTEND_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan backend image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Scan frontend image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Push images to GHCR
        run: |
          docker push "$BACKEND_IMAGE:${{ github.sha }}"
          docker push "$BACKEND_IMAGE:latest"
          docker push "$FRONTEND_IMAGE:${{ github.sha }}"
          docker push "$FRONTEND_IMAGE:latest"

  deploy:
    # Stays GREEN with no cluster: flip the DEPLOY_ENABLED repo variable to
    # 'true' and add KUBE_CONFIG_DATA once EKS is ready (see MY_STEPS.md).
    if: vars.DEPLOY_ENABLED == 'true'
    needs: build-scan-push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4.2.2

      - name: Install Helm
        uses: azure/setup-helm@v4.3.0
        with:
          version: v3.16.3

      - name: Configure kubeconfig
        env:
          KUBE_CONFIG_DATA: ${{ secrets.KUBE_CONFIG_DATA }}
        run: |
          mkdir -p ~/.kube
          echo "$KUBE_CONFIG_DATA" | base64 -d > ~/.kube/config

      - name: Resolve lowercase image names
        run: |
          owner_lower="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          echo "BACKEND_IMAGE=ghcr.io/${owner_lower}/caredesk-backend" >> "$GITHUB_ENV"
          echo "FRONTEND_IMAGE=ghcr.io/${owner_lower}/caredesk-frontend" >> "$GITHUB_ENV"

      - name: Deploy CareDesk with Helm
        run: |
          helm upgrade --install caredesk ./helm/caredesk -n caredesk --create-namespace \
            -f helm/caredesk/values-eks.yaml \
            --set backend.image="$BACKEND_IMAGE" \
            --set backend.tag=${{ github.sha }} \
            --set frontend.image="$FRONTEND_IMAGE" \
            --set frontend.tag=${{ github.sha }}
