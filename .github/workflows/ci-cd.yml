name: CareDesk CI/CD

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: caredesk-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2

      - name: Set up Python 3.12
        uses: actions/setup-python@v5.3.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Run backend tests
        working-directory: backend
        run: pytest -v

      - name: Set up Node 22
        uses: actions/setup-node@v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: npm ci && npm run build

  build-scan-push:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      TRIVY_DB_REPOSITORY: public.ecr.aws/aquasecurity/trivy-db:2
      TRIVY_JAVA_DB_REPOSITORY: public.ecr.aws/aquasecurity/trivy-java-db:1
    steps:
      - uses: actions/checkout@v4.2.2

      - name: Resolve lowercase image names
        run: |
          owner_lower="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          echo "BACKEND_IMAGE=ghcr.io/${owner_lower}/caredesk-backend" >> "$GITHUB_ENV"
          echo "FRONTEND_IMAGE=ghcr.io/${owner_lower}/caredesk-frontend" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3.9.0

      - name: Log in to GHCR
        uses: docker/login-action@v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build backend image
        uses: docker/build-push-action@v6.9.0
        with:
          context: ./backend
          platforms: linux/amd64
          load: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
            ${{ env.BACKEND_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v6.9.0
        with:
          context: ./frontend
          platforms: linux/amd64
          load: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
            ${{ env.FRONTEND_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan backend image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Scan frontend image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Push images to GHCR
        run: |
          docker push "$BACKEND_IMAGE:${{ github.sha }}"
          docker push "$BACKEND_IMAGE:latest"
          docker push "$FRONTEND_IMAGE:${{ github.sha }}"
          docker push "$FRONTEND_IMAGE:latest"

  deploy:
    if: vars.DEPLOY_ENABLED == 'true' && github.ref == 'refs/heads/main'
    needs: build-scan-push
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ap-southeast-2
      EKS_CLUSTER_NAME: caredesk-eks

    steps:
      - uses: actions/checkout@v4.2.2

      - name: Authenticate to AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::915087794462:role/caredesk-github-deploy
          aws-region: ap-southeast-2
          role-session-name: caredesk-github-deploy

      - name: Configure EKS connection
        run: |
          aws eks update-kubeconfig \
            --name "$EKS_CLUSTER_NAME" \
            --region "$AWS_REGION" \
            --alias caredesk-aws

      - name: Install Helm
        uses: azure/setup-helm@v4.3.0
        with:
          version: v3.21.4

      - name: Resolve lowercase image names
        run: |
          owner_lower="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          echo "BACKEND_IMAGE=ghcr.io/${owner_lower}/caredesk-backend" >> "$GITHUB_ENV"
          echo "FRONTEND_IMAGE=ghcr.io/${owner_lower}/caredesk-frontend" >> "$GITHUB_ENV"

      - name: Deploy CareDesk with Helm
        run: |
          helm upgrade caredesk ./helm/caredesk \
            --kube-context caredesk-aws \
            --namespace caredesk \
            --reuse-values \
            --set-string backend.image="$BACKEND_IMAGE" \
            --set-string backend.tag="${{ github.sha }}" \
            --set-string frontend.image="$FRONTEND_IMAGE" \
            --set-string frontend.tag="${{ github.sha }}" \
            --atomic \
            --wait \
            --timeout 8m

      - name: Verify Helm release
        run: |
          helm status caredesk \
            --kube-context caredesk-aws \
            --namespace caredesk
