services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: caredesk
      POSTGRES_USER: caredesk
      POSTGRES_PASSWORD: caredesk
    volumes:
      - caredesk-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U caredesk -d caredesk"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://caredesk:caredesk@postgres:5432/caredesk
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    environment:
      BACKEND_HOST: backend:8000
    depends_on:
      - backend
    ports:
      - "3000:8080"

volumes:
  caredesk-postgres-data:
